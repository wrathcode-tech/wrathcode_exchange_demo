<script>
  $(document).ready(function() {
    const select = document.querySelector('.custom-select');
    if (select) {
      const selected = select.querySelector('.selected-option');
      const options = select.querySelectorAll('.option');

      if (selected) {
        selected.addEventListener('click', () => {
          select.classList.toggle('open');
        });
      }

      if (options) {
        options.forEach(option => {
          option.addEventListener('click', () => {
            if (selected) {
              selected.innerHTML = option.innerHTML;
            }
            select.classList.remove('open');
          });
        });
      }
    }
  });
</script>

<script>
  // Hover → show scrollbar
  $(document).on("mouseenter", ".table-responsive", function () {
    $(this).addClass("show-scrollbar");
  });

  // Leave → hide scrollbar
  $(document).on("mouseleave", ".table-responsive", function () {
    $(this).removeClass("show-scrollbar");
  });

  // Scroll → auto show (important for touchpad)
  $(document).on("scroll", ".table-responsive", function () {
    const el = $(this);

    el.addClass("show-scrollbar");

    clearTimeout(el.data("sb_timer"));
    el.data("sb_timer", setTimeout(() => {
      el.removeClass("show-scrollbar");
    }, 700));
  });

</script>

<!-- Mobile Keyboard Handler - Scroll focused input into view -->
<script>
  (function() {
    'use strict';
    
    // Only run on mobile/touch devices
    function isMobileDevice() {
      return (
        ('ontouchstart' in window) ||
        (navigator.maxTouchPoints > 0) ||
        (window.innerWidth <= 768)
      );
    }
    
    // Safe scroll into view with fallback
    function safeScrollIntoView(element) {
      if (!element || typeof element.scrollIntoView !== 'function') return;
      
      try {
        // Find the scrollable modal container
        var modalBody = element.closest('.modal-body');
        var modalContent = element.closest('.modal-content');
        
        if (modalBody) {
          // Calculate position relative to modal body
          var elementRect = element.getBoundingClientRect();
          var modalRect = modalBody.getBoundingClientRect();
          var scrollTop = modalBody.scrollTop;
          var relativeTop = elementRect.top - modalRect.top + scrollTop;
          
          // Scroll to center the element in view
          var targetScroll = relativeTop - (modalRect.height / 3);
          
          modalBody.scrollTo({
            top: Math.max(0, targetScroll),
            behavior: 'smooth'
          });
        } else if (modalContent) {
          // Fallback to modal-content if no modal-body
          element.scrollIntoView({ 
            behavior: 'smooth', 
            block: 'center',
            inline: 'nearest'
          });
        }
      } catch (e) {
        // Ultimate fallback - simple scrollIntoView
        try {
          element.scrollIntoView({ block: 'center' });
        } catch (e2) {
          // Silently fail if scrollIntoView not supported
        }
      }
    }
    
    function initMobileKeyboardHandler() {
      if (!isMobileDevice()) return;
      
      var activeInput = null;
      var scrollTimeout = null;
      var lastViewportHeight = window.innerHeight;
      
      // Debounce function
      function debounce(func, wait) {
        var timeout;
        return function() {
          var context = this, args = arguments;
          clearTimeout(timeout);
          timeout = setTimeout(function() {
            func.apply(context, args);
          }, wait);
        };
      }
      
      // Handle viewport resize (keyboard open/close)
      function handleViewportResize() {
        if (!activeInput) return;
        
        var currentHeight = window.visualViewport 
          ? window.visualViewport.height 
          : window.innerHeight;
        
        // Keyboard opened (viewport got smaller by at least 150px)
        if (lastViewportHeight - currentHeight > 150) {
          clearTimeout(scrollTimeout);
          scrollTimeout = setTimeout(function() {
            if (activeInput && document.activeElement === activeInput) {
              safeScrollIntoView(activeInput);
            }
          }, 50);
        }
        
        lastViewportHeight = currentHeight;
      }
      
      // Track focused input
      function handleFocus(event) {
        var el = event.target;
        var tagName = el.tagName ? el.tagName.toLowerCase() : '';
        
        // Only handle input elements inside modals
        if ((tagName === 'input' || tagName === 'select' || tagName === 'textarea')) {
          var modal = el.closest('.modal');
          if (modal && modal.classList.contains('show')) {
            activeInput = el;
            
            // Delayed scroll for keyboard animation
            clearTimeout(scrollTimeout);
            scrollTimeout = setTimeout(function() {
              if (document.activeElement === el) {
                safeScrollIntoView(el);
              }
            }, 350);
          }
        }
      }
      
      // Clear tracked input on blur
      function handleBlur() {
        clearTimeout(scrollTimeout);
        // Delay clearing so resize handler can still access it
        setTimeout(function() {
          if (document.activeElement && 
              document.activeElement.tagName && 
              !['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
            activeInput = null;
          }
        }, 100);
      }
      
      // Attach event listeners
      document.addEventListener('focusin', handleFocus, { passive: true });
      document.addEventListener('focusout', handleBlur, { passive: true });
      
      // Use Visual Viewport API if available (more reliable)
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', debounce(handleViewportResize, 50), { passive: true });
      } else {
        // Fallback to window resize
        window.addEventListener('resize', debounce(handleViewportResize, 100), { passive: true });
      }
    }
    
    // Initialize when DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initMobileKeyboardHandler);
    } else {
      initMobileKeyboardHandler();
    }
  })();
</script>

  <script>
    function initCryptoFuture() {

      $(".cryptofuture_s").each(function () {

        const $section = $(this);

        // duplicate binding se bachne ke liye
        if ($section.data("binded")) return;
        $section.data("binded", true);

        const $images = $section.find(".exchange_future_s img");

        $section.on("mousemove.crypto", function (e) {

          const offset = $section.offset();
          const width = $section.outerWidth();
          const height = $section.outerHeight();

          const x = e.pageX - offset.left;
          const y = e.pageY - offset.top;

          const centerX = width / 2;
          const centerY = height / 2;

          const moveX = ((x - centerX) / centerX) * 60;
          const moveY = ((y - centerY) / centerY) * 60;

          $images.each(function (index) {
            const depth = (index + 1) * 0.5;
            $(this).css(
              "transform",
              `translate(${moveX * depth}px, ${moveY * depth}px)`
            );
          });
        });

        $section.on("mouseleave.crypto", function () {
          $images.css("transform", "translate(0px, 0px)");
        });

      });
    }

    // first load
    $(document).ready(function () {
      initCryptoFuture();
    });

    // React SPA route change / DOM update detect
    const observer = new MutationObserver(function () {
      initCryptoFuture();
    });

    observer.observe(document.body, {
      childList: true,
      subtree: true
    });
  </script>

  <script>
    $(document).ready(function () {

      let currentStep = 0;
      let steps, totalSteps;

      function initKycSteps() {
        const modal = $('#kycModal');
        steps = modal.find('.kyc_step');
        totalSteps = steps.length;
        currentStep = 0;
        showStep(currentStep);
        // Reset validation errors
        $('#countryError, #idTypeError').addClass('d-none');
      }

      function showStep(step) {
        if (!steps || steps.length === 0) return;

        steps.hide().removeClass('active');
        steps.eq(step).fadeIn(200).addClass('active');

        // update title from step attribute
        const title = steps.eq(step).data('title');
        if (title) {
          $('#kycTitle').text(title);
        }
      }

      function validateStep0() {
        const country = $('#kycCountry').val();
        const idType = $('input[name="kycIdType"]:checked').val();

        let isValid = true;

        // Hide previous errors
        $('#countryError, #idTypeError').addClass('d-none');
        $('.select_box').removeClass('error');
        $('.id_grid').removeClass('error');

        if (!country || country === '') {
          $('#countryError').removeClass('d-none');
          $('.select_box').addClass('error');
          isValid = false;
        }

        if (!idType) {
          $('#idTypeError').removeClass('d-none');
          $('.id_grid').addClass('error');
          isValid = false;
        }

        return isValid;
      }

      // Remove error on change
      $(document).on('change', '#kycCountry', function () {
        if ($(this).val()) {
          $('#countryError').addClass('d-none');
          $('.select_box').removeClass('error');
        }
      });

      $(document).on('change', 'input[name="kycIdType"]', function () {
        if ($(this).is(':checked')) {
          $('#idTypeError').addClass('d-none');
          $('.id_grid').removeClass('error');
        }
      });

      // Initialize when modal is shown (Bootstrap 5)
      $('#kycModal').on('shown.bs.modal', function () {
        initKycSteps();
      });

      // Also initialize on show event as fallback
      $('#kycModal').on('show.bs.modal', function () {
        // Reset to first step when modal opens
        currentStep = 0;
      });

      // NEXT
      $(document).on('click', '#kycModal .nextStep', function (e) {
        e.preventDefault();
        e.stopPropagation();

        // Validate current step
        if (currentStep === 0) {
          if (!validateStep0()) {
            return false;
          }
        }

        if (currentStep < totalSteps - 1) {
          currentStep++;
          showStep(currentStep);
        } else {
          console.log('Already at last step');
        }
        return false;
      });

      // BACK
      $(document).on('click', '#kycModal .prevStep', function (e) {
        e.preventDefault();
        e.stopPropagation();
        if (currentStep > 0) {
          currentStep--;
          showStep(currentStep);
        }
        return false;
      });

      // SUBMIT BUTTON - Open confirmation modal
      $(document).on('click', '#kycModal button.primary_btn', function (e) {
        e.preventDefault();
        e.stopPropagation();
        // Check if this is the submit button (last step - Face Verification)
        const stepTitle = $(this).closest('.kyc_step').data('title');
        const buttonText = $(this).text().trim();

        if (stepTitle === 'Face Verification' && (buttonText === 'Submit' || buttonText.includes('Submit'))) {
          $('#kycSubmitModal').modal('show');
          return false;
        }
      });

      // Initialize on page load if modal is already visible
      if ($('#kycModal').is(':visible')) {
        initKycSteps();
      }

    });
  </script>
